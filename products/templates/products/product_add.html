{% extends "base.html" %}
{% block content %}
  <div class="container my-2">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-7 col-xxl-6">
        <div class="card">
          <div class="card-header">
            <p class="h2 mb-0">Add New Product</p>
          </div>
          <div class="card-body">
            <form method="post" enctype="multipart/form-data" class="product-form">
              {% csrf_token %}
              <div class="row g-3">
                <!-- Name -->
                <div class="col-12">
                  <label for="{{ form.name.id_for_label }}" class="form-label">
                    Product Name <span class="text-danger">*</span>
                  </label>
                  {{ form.name }}
                </div>
                <!-- Product Image -->
                <div class="col-12 col-md-6">
                  <label for="{{ form.image.id_for_label }}" class="form-label">Product Image</label>
                  {{ form.image }}
                  <div class="form-text">Upload an image for your product</div>
                </div>
                <!-- Price -->
                <div class="col-12 col-md-6">
                  <label for="{{ form.price.id_for_label }}" class="form-label">Price (£)</label>
                  {{ form.price }}
                </div>
                <!-- Categories -->
                <div class="col-12">
                  <label class="form-label">Categories</label>
                  <div class="d-flex flex-wrap gap-2">
                    {% for category in form.categories.field.queryset %}
                      <input type="checkbox"
                             class="btn-check"
                             name="categories"
                             value="{{ category.id }}"
                             id="category-{{ category.id }}"
                             autocomplete="off">
                      <label class="btn btn-outline-secondary" for="category-{{ category.id }}">{{ category.friendly_name }}</label>
                    {% endfor %}
                  </div>
                </div>
                <!-- Description -->
                <div class="col-12">
                  <label for="{{ form.description.id_for_label }}" class="form-label">Description</label>
                  {{ form.description }}
                </div>
                <div class="col-12">
                  <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary me-2">
                      <i class="fas fa-plus"></i> Add Product
                    </button>
                    <a href="{% url 'products_list' %}" class="btn btn-accent">
                      <i class="fas fa-times"></i> Cancel
                    </a>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
