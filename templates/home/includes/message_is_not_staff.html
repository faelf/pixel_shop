<h2 class="h2">Contact Us</h2>
<form method="post" action="{% url 'contact' %}">
  {% csrf_token %}
  <div class="row">
    <div class="col-12 col-sm-6 col-lg-12 col-xl-6 mb-3">
      <label for="{{ form.name.id_for_label }}" class="form-label">{{ form.name.label }}</label>
      {{ form.name }}
      {% if form.name.errors %}<div class="text-danger small mt-1">{{ form.name.errors }}</div>{% endif %}
    </div>
    <div class="col-12 col-sm-6 col-lg-12 col-xl-6 mb-3">
      <label for="{{ form.email.id_for_label }}" class="form-label">{{ form.email.label }}</label>
      {{ form.email }}
      {% if form.email.errors %}<div class="text-danger small mt-1">{{ form.email.errors }}</div>{% endif %}
    </div>
    <div class="mb-3">
      <label for="{{ form.message.id_for_label }}" class="form-label">{{ form.message.label }}</label>
      {{ form.message }}
      {% if form.message.errors %}<div class="text-danger small mt-1">{{ form.message.errors }}</div>{% endif %}
    </div>
    <div class="text-end">
      <button type="submit" class="btn btn-primary">
        <i class="fa-solid fa-paper-plane me-2"></i>Send
      </button>
    </div>
  </div>
</form>
