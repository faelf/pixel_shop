<h2 class="h2">Contact Messages</h2>
<div class="row my-3">
  {% for message in user_messages %}
    <div class="col-6 col-md-3">
      <p class="h6 mb-1">
        <i class="fas fa-user me-2"></i>
        {{ message.name }}
      </p>
      <p class="mb-1">
        <i class="fa-solid fa-envelope me-2"></i>
        <a class="text-decoration-none" href="mailto:{{ message.email }}">{{ message.email }}</a>
      </p>
      <p class="text-muted">
        <i class="far fa-clock me-1"></i>
        {{ message.created_at|date:"d F Y" }}
      </p>
    </div>
    <div class="col-6 col-md-6">
      <p class="mb-3">{{ message.message }}</p>
    </div>
    <div class="col-12 col-md-3 text-end mt-2">
      <form action="{% url 'delete_message' message.id %}"
            method="post"
            class="d-inline">
        {% csrf_token %}
        <button type="submit"
                class="btn btn-danger btn-sm"
                onclick="return confirm('Are you sure you want to delete this message?');">
          <i class="fa-solid fa-trash-alt me-1"></i> Delete
        </button>
      </form>
    </div>
    {% if not forloop.last %}<hr>{% endif %}
  {% empty %}
    <div class="alert alert-info text-center">
      <i class="fa-solid fa-inbox me-2"></i>No messages received yet.
    </div>
  {% endfor %}
</div>
